name: Descomprimir y Compilar AutoStacker APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Descomprimir el ZIP de AI Studio y configurar Gradle automáticamente
        run: |
          unzip -o "*.zip"

          # Eliminar carpetas de plantilla de Compose/Tests que AI Studio mete por defecto y no usamos
          rm -rf app/src/main/java/com/example/ui app/src/test app/src/androidTest

          # Detectar automáticamente el package de MainActivity.java para que nunca falle el namespace
          DETECTED_PKG=$(grep -h "^package " $(find app/src/main/java -name "*.java") | head -n 1 | sed 's/package //;s/;//;s/[[:space:]]//g')
          if [ -z "$DETECTED_PKG" ]; then
            DETECTED_PKG="com.example"
          fi
          echo "Package detectado automáticamente: $DETECTED_PKG"

          # Activar AndroidX en gradle.properties para evitar el fallo de CheckAarMetadataTask
          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "AutoStacker100"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.7.3" apply false
          }
          EOF

          cat << EOF > app/build.gradle.kts
          plugins {
              id("com.android.application")
          }
          android {
              namespace = "$DETECTED_PKG"
              compileSdk = 35
              defaultConfig {
                  applicationId = "com.example.autostacker100"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_11
                  targetCompatibility = JavaVersion.VERSION_11
              }
          }
          dependencies {
              implementation("androidx.appcompat:appcompat:1.7.0")
          }
          EOF

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compilar APK Debug
        run: gradle assembleDebug --no-configuration-cache

      - name: Publicar APK para descargar
        uses: actions/upload-artifact@v4
        with:
          name: AutoStacker-100-APK
          path: app/build/outputs/apk/debug/app-debug.apk
