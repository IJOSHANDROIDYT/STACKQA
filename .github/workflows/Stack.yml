name: Descomprimir y Compilar APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Descomprimir el ZIP de AI Studio y limpiar plantilla
        run: |
          unzip -o "*.zip"
          rm -rf app/src/main/java/com/example/ui app/src/test app/src/androidTest

          # Asegurar que todos los archivos .java esten en com.example por si AI Studio uso una subcarpeta
          find app/src/main/java -name "*.java" -exec sed -i 's/^package .*/package com.example;/' {} +
          mkdir -p app/src/main/java/com/example
          find app/src/main/java -name "*.java" -exec mv -n {} app/src/main/java/com/example/ \; 2>/dev/null || true

          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "AutoStacker100"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.7.3" apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
          }
          android {
              namespace = "com.example"
              compileSdk = 35
              defaultConfig {
                  applicationId = "com.example.autostacker100"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_11
                  targetCompatibility = JavaVersion.VERSION_11
              }
          }
          EOF

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compilar APK Debug
        run: gradle assembleDebug

      - name: Publicar APK para descargar
        uses: actions/upload-artifact@v4
        with:
          name: AutoStacker-100-APK
          path: app/build/outputs/apk/debug/app-debug.apk
